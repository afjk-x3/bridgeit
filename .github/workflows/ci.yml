name: CI

on:
  push:
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Same Flutter as both dev machines; bump all three together.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
