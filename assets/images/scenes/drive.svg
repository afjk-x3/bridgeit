<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" role="img" aria-label="View from the driver's seat">
  <title>Driver's seat</title>
  <rect id="sky" width="400" height="430" fill="#E6F5FF"/>
  <g id="trees" fill="#80C0A8" stroke="#183870" stroke-width="3">
    <circle cx="28" cy="340" r="46"/>
    <circle cx="84" cy="368" r="34"/>
    <circle cx="372" cy="340" r="46"/>
    <circle cx="316" cy="368" r="34"/>
  </g>
  <path id="ground" d="M0 390 H400 V800 H0Z" fill="#CDE6D8" stroke="#183870" stroke-width="3"/>
  <path id="road" d="M178 390 H222 L400 640 V800 H0 V640Z" fill="#6F7F9E" stroke="#183870" stroke-width="3"/>
  <path id="road-line" d="M200 402 V436 M200 456 V506 M200 530 V600" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <g id="sign">
