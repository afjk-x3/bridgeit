<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 40 720 520" role="img" aria-label="BridgeIt">
  <title>BridgeIt</title>
  <defs>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#80C0A8"/>
      <stop offset="1" stop-color="#309090"/>
    </linearGradient>
    <g id="span-half">
      <path d="M205 104 Q268 130 334 134 M205 208 Q262 204 322 188" stroke="#183870" stroke-width="15"/>
      <path d="M224 113 V207 M244 121 V205 M264 126 V201 M284 130 V196" stroke="#183870" stroke-width="9"/>
      <path d="M224 113 V207 M244 121 V205 M264 126 V201 M284 130 V196" stroke="#55AB9E" stroke-width="4"/>
      <path d="M205 104 Q268 130 334 134 M205 208 Q262 204 322 188" stroke="#55AB9E" stroke-width="9"/>
    </g>
    <g id="pages-half">
      <path d="M180 242 L155 265 C258 268 334 298 372 346 C338 284 266 253 180 242Z"/>
      <path d="M150 277 L134 304 C246 298 326 318 369 352 C326 308 240 283 150 277Z"/>
      <path d="M130 315 L120 344 C224 330 310 336 381 364 V356 C318 324 228 311 130 315Z"/>
    </g>
  </defs>

  <g id="mark" transform="translate(0 -8)">
    <g id="bridge" fill="none">
      <use href="#span-half"/>
      <use href="#span-half" transform="matrix(-1 0 0 1 762 0)"/>
      <rect x="180" y="82" width="26" height="160" fill="url(#tower)" stroke="#183870" stroke-width="4"/>
      <rect x="556" y="82" width="26" height="160" fill="url(#tower)" stroke="#183870" stroke-width="4"/>
    </g>

    <!-- woven: teal over orange at the top crossing, orange over teal at the bottom -->
    <g id="links" fill="none">
      <ellipse id="link-orange" cx="410" cy="168" rx="44" ry="33" stroke="#183870" stroke-width="20"/>
      <ellipse cx="410" cy="168" rx="44" ry="33" stroke="#E09A6C" stroke-width="13"/>
      <ellipse id="link-teal" cx="352" cy="168" rx="44" ry="33" stroke="#183870" stroke-width="20"/>
      <ellipse cx="352" cy="168" rx="44" ry="33" stroke="#309090" stroke-width="13"/>
      <path id="link-orange-over" d="M366 168 A44 33 0 0 0 396 199.3" stroke="#183870" stroke-width="20"/>
      <path d="M367.5 159.5 A44 33 0 0 0 405 200.8" stroke="#E09A6C" stroke-width="13"/>
    </g>

    <g id="book" fill="#1B3F78">
      <use href="#pages-half"/>
      <use href="#pages-half" transform="matrix(-1 0 0 1 762 0)"/>
    </g>
  </g>

  <!-- stems 26 wide, x-height 416, baseline 500, caps 388 -->
  <g id="wordmark" fill="none" stroke-width="26">
    <g stroke="#1B3F78">
      <g id="B">
        <path stroke-width="18" d="M59 388 V500"/>
        <path d="M50 401 H120 C142 401 152 411 152 423 C152 436 142 444 122 444 H59 M122 444 C146 444 158 453 158 466 C158 479 146 487 122 487 H50"/>
      </g>
      <path id="r" d="M205 500 V416 M205 454 C208 434 224 427 246 427"/>
      <path id="i" d="M275 416 V500"/>
      <circle id="i-dot" cx="275" cy="392" r="15" fill="#1B3F78" stroke="none"/>
      <g id="d">
        <circle cx="348" cy="459" r="33"/>
        <path d="M381 388 V500"/>
      </g>
      <g id="g">
        <circle cx="458" cy="459" r="33"/>
        <path d="M491 416 V506 C491 530 474 540 450 540 H428"/>
      </g>
      <g id="e">
        <path d="M607 459 A33 33 0 1 0 599 481"/>
        <path stroke-width="12" d="M541 461 H620"/>
      </g>
    </g>
    <path id="I" stroke="#1F9385" d="M647 388 V500"/>
    <path id="t" stroke="#D88858" d="M702 396 V468 C702 484 712 490 736 488 M678 428 H738"/>
  </g>
</svg>
